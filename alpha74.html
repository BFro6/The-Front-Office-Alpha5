:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f5f5;background:#111315}*{box-sizing:border-box}body{margin:0}header{padding:18px;background:linear-gradient(130deg,#17191c,#332017);border-bottom:3px solid #fb4f14}header small{letter-spacing:2px;color:#ffb38f}h1{margin:6px 0;font-size:26px}main{max-width:980px;margin:auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.panel{background:#202327;border:1px solid #393d42;border-radius:13px;padding:13px}.stat b{display:block;font-size:21px}.muted{color:#b5b9bf;font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0}.tabs button{white-space:nowrap}button,select{background:#30353b;color:white;border:1px solid #555c64;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button.primary{background:#fb4f14;border-color:#fb4f14;color:#141414;font-weight:800}button:disabled{opacity:.4;cursor:not-allowed}.panel{margin:12px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #363a40}.line:last-child{border-bottom:0}.line>div:first-child{min-width:0}.line strong{display:block}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions button{font-size:12px;padding:7px}.alert{border-left:4px solid #fb4f14;padding:10px;background:#31251f;margin:8px 0}.ok{color:#80d4a2}.warn{color:#ffba78}h2{font-size:19px}h3{font-size:15px}#notice{position:sticky;top:0;background:#382b1c;padding:10px;border-radius:8px;display:none;z-index:5}footer{padding:20px;color:#aaa;font-size:12px;text-align:center}.tag{font-size:11px;padding:3px 7px;border-radius:20px;background:#40454b}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.line{align-items:flex-start}.line .actions{max-width:150px}h1{font-size:22px}} .weekcard{border:1px solid #fb4f14;border-radius:14px;padding:14px;background:linear-gradient(125deg,#33241c,#202327);margin:12px 0}.choices{display:grid;grid-template-columns:1fr;gap:8px}.choice{text-align:left;width:100%;padding:12px}.choice.chosen{border-color:#fb4f14;background:#4c2d20}.choice b{display:block}.report{border-left:4px solid #76c79a;padding:12px;background:#1c3029;margin:10px 0}.toolbar{position:sticky;top:0;background:#111315ed;z-index:4;padding:8px 0}.pill{display:inline-block;background:#40352e;border-radius:30px;padding:5px 9px;font-size:12px;margin:3px} .modalshade{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}.modal{width:min(550px,100%);max-height:92vh;overflow:auto;background:#202327;border:2px solid #fb4f14;border-radius:16px;padding:18px}.modal label{display:block;margin:10px 0}.modal input{width:100%;background:#121416;color:white;border:1px solid #555;padding:10px;border-radius:8px;font:inherit}.socialpost{background:#252b32;border-radius:12px;padding:13px;margin:10px 0;border-left:3px solid #fb4f14}.tiny{font-size:12px;color:#c2c4c7}.assistant{border:1px solid #657f69;background:#1d3028;border-radius:12px;padding:12px;margin:10px 0} </style></head><body>
<header><small>THE FRONT OFFICE / CINCINNATI</small><h1>GENERAL MANAGER COMMAND CENTER</h1><div class="muted">ALPHA 7.4 · REAL ROSTER IMPORT + SOCIAL PULSE 2.0</div></header><main><div id="notice"></div><div id="stats" class="stats"></div><nav class="tabs" id="tabs"></nav><section id="content"></section><div id="overlay"></div></main><footer>Alpha 7.4 is a fictional gameplay prototype using demonstration personnel, simplified cap and simulated opponents. It shares Alpha 7.0 lab save data; Alpha 6 is separate.</footer>
<script>
(()=>{'use strict';
const KEY='frontoffice_alpha74_v1',CAP=255,TEAM='CIN';
const requirements={QB:2,RB:3,WR:5,TE:3,OT:3,OG:3,C:2,EDGE:4,DT:3,LB:4,CB:5,S:4,K:1,P:1,LS:1};
const teams=['ARI','ATL','BAL','BUF','CAR','CHI','CIN','CLE','DAL','DEN','DET','GB','HOU','IND','JAX','KC','LV','LAC','LAR','MIA','MIN','NE','NO','NYG','NYJ','PHI','PIT','SF','SEA','TB','TEN','WAS'];
const sample=[
['Joe Burrow','QB',45,4,94],['Ja’Marr Chase','WR',39,4,97],['Tee Sample','WR',5,1,73],['Myles Sample','OT',6,2,75],['Owen Sample','TE',3,2,74],['Rico Sample','RB',4,2,76],['Devon Sample','EDGE',10,3,83],['Caleb Sample','CB',7,2,77],['Marcus Sample','S',5,2,75],['Evan Sample','K',2,2,82],
['Andre Mercer','OT',3,1,69],['Darius Cole','OT',2,1,66],['Trey Maddox','OG',2,1,68],['Jalen Price','CB',2,1,70],['Noah Banks','WR',1,1,67],['Eli Rivers','LB',2,1,68],['Malik Ward','DT',3,1,71],['Sam Porter','QB',2,1,65],['Tyson Reid','EDGE',3,1,72],['Dante Brooks','S',1,1,67],['Liam Foster','C',2,1,69],['Evan Hayes','RB',1,1,68]
];
function seed(){let players=sample.map((a,i)=>({id:'p'+i,name:a[0],pos:a[1],salary:a[2],years:a[3],ovr:a[4],team:i<10?TEAM:null,status:i<10?'active':'FA',real:i<2}));return {version:1,week:1,year:2026,team:TEAM,players,log:[{week:1,text:'New demonstration career created. Personnel actions are now available.'}],decisions:[],history:[]}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))||seed()}catch{s=seed()}if(!s.players||!Array.isArray(s.players))s=seed();let tab='setup';if(!s.social)s.social=[];if(!s.assistantMode)s.assistantMode='guided';if(!s.tradeInbox)s.tradeInbox=[];if(!s.tradeBlock)s.tradeBlock={};if(!s.tradeTick)s.tradeTick=0;
if(!s.season){s.season={year:2026,week:1,wins:0,losses:0,bye:7,opponents:['BAL','PIT','CLE','KC','BUF','NE','BYE','NYJ','HOU','DEN','BAL','IND','PIT','MIA','CLE','LAC','JAX','TEN'],plans:{},reports:[],injuries:[],confidence:65};}
const season=s.season; if(!season.plans)season.plans={};if(!season.reports)season.reports=[];if(!season.injuries)season.injuries=[];

const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(s)),mine=()=>s.players.filter(p=>p.team===TEAM&&p.status==='active'),ps=()=>s.players.filter(p=>p.team===TEAM&&p.status==='practice'),fa=()=>s.players.filter(p=>p.status==='FA'),spent=()=>mine().concat(ps()).reduce((n,p)=>n+p.salary,0),money=()=>CAP-spent()-(s.deadCap||0),counts=()=>Object.fromEntries(Object.keys(requirements).map(pos=>[pos,mine().filter(p=>p.pos===pos).length])),shortages=()=>Object.entries(requirements).filter(([pos,n])=>counts()[pos]<n),escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(t){let el=$('notice');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3500)}
function log(t){addSocial(t);s.log.unshift({week:s.week,text:t});s.log=s.log.slice(0,150);save();render();notice(t)}
function playerRow(p,buttons){return `<div class="line"><div><strong>${escape(p.name)} <span class="tag">${p.pos}</span></strong><span class="muted">OVR ${p.ovr} · $${p.salary}M · ${p.years} yr${p.years===1?'':'s'} ${p.real?'· REAL NAME / DEMO CONTRACT':'· FICTIONAL'}</span></div><div class="actions">${buttons}</div></div>`}
function btn(label,action,id,disabled=false){return `<button data-action="${action}" data-id="${id}" ${disabled?'disabled':''}>${label}</button>`}
function act(action,id){const p=s.players.find(x=>x.id===id);if(!p)return;if(action==='manage'){openPlayer(p);return}if(action==='block'){if(p.team!==TEAM)return;s.tradeBlock[p.id]=!s.tradeBlock[p.id];closeOverlay();log(`${p.name} ${s.tradeBlock[p.id]?'added to':'removed from'} the trade block.`);return}if(action==='extend'||action==='restructure'){openContract(p,action);return}const active=mine().length,practice=ps().length;
if(action==='negotiate'){openNegotiation(p);return}if(action==='sign'){if(p.status!=='FA'||money()<p.salary||active>=53)return notice('Cannot sign: check cap and active roster limit.');p.team=TEAM;p.status='active';log(`Signed ${p.name} (${p.pos}) to the active roster for $${p.salary}M.`)}
if(action==='pssign'){if(p.status!=='FA'||money()<p.salary||practice>=16)return notice('Cannot sign to practice squad: check cap and squad limit.');p.team=TEAM;p.status='practice';log(`Signed ${p.name} to the practice squad. (Eligibility simplified in this lab.)`)}
if(action==='promote'){if(p.team!==TEAM||p.status!=='practice'||active>=53)return notice('Cannot promote: active roster is full.');p.status='active';log(`Promoted ${p.name} from practice squad to active roster.`)}
if(action==='demote'){if(p.team!==TEAM||p.status!=='active'||practice>=16)return notice('Cannot move player to practice squad.');if(!confirm(`Move ${p.name} to practice squad? Real NFL waiver/eligibility rules are NOT simulated yet.`))return;p.status='practice';log(`Moved ${p.name} to practice squad (simplified lab rules).`)}
if(action==='release'){if(p.team!==TEAM)return;const dead=deadMoney(p),saving=p.salary-dead;if(!confirm(`Release ${p.name}?\nEstimated current cap savings: $${saving.toFixed(1)}M\nEstimated dead money: $${dead.toFixed(1)}M\nDEMO estimates; NFL guarantee rules not modeled.`))return;p.team=null;p.status='FA';delete s.tradeBlock[p.id];s.deadCap=(s.deadCap||0)+dead;closeOverlay();log(`Released ${p.name}. Estimated $${dead.toFixed(1)}M dead cap, $${saving.toFixed(1)}M savings (demo rules).`)}
}
function brief(){let needs=shortages(),last=s.log[0];return `<div class="panel"><h2>Week ${s.week} · Personnel Briefing</h2><p class="muted">Your roster needs affect weekly simulation. Use This Week to plan and simulate games.</p><div class="alert"><strong>${needs.length} position groups below target</strong><p>Roster targets are planning guidelines, not NFL roster minimums. Every shortage links to a useful action.</p></div>${needs.slice(0,7).map(([pos,n])=>`<div class="line"><div><strong>${pos}: ${counts()[pos]} / target ${n}</strong><span class="muted">${n-counts()[pos]} additional recommended</span></div><div class="actions">${btn('Find players','find',pos)}</div></div>`).join('')}<h3>Latest transaction</h3><p>${escape(last?.text||'None')}</p></div><div class="panel"><h2>Weekly Personnel Review</h2><p>Review your roster, sign available players, and promote practice-squad depth. Personnel decisions now affect weekly games. Open This Week to plan and simulate.</p>${btn('Review free agents','go','fa')} ${btn('View full roster','go','roster')}</div>`}
function roster(){let c=counts();return `<div class="panel"><h2>Active Roster (${mine().length}/53)</h2><p class="muted">Demo roster, not the actual 2026 Bengals. Position targets are illustrative.</p>${Object.entries(requirements).map(([pos,n])=>`<div class="line"><div><strong>${pos} · ${c[pos]} / ${n} ${c[pos]<n?'⚠️':''}</strong><span class="muted">${c[pos]<n?`Need ${n-c[pos]} for planning target`:'Target met'}</span></div><div class="actions">${btn('Find '+pos,'find',pos)}</div></div>${mine().filter(p=>p.pos===pos).map(p=>playerRow(p,btn('Manage','manage',p.id)+btn(s.tradeBlock[p.id]?'Unlist':'Trade block','block',p.id))).join('')}`).join('')}</div>`}
function practice(){return `<div class="panel"><h2>Practice Squad (${ps().length}/16)</h2><p class="muted">Promotion and demotion work. Waiver rules, veteran eligibility and game-day elevation limits will be implemented later.</p>${ps().length?ps().map(p=>playerRow(p,btn('Manage','manage',p.id)+btn('Promote','promote',p.id,mine().length>=53))).join(''):'<p>No practice squad players yet. Sign some from the available player pool.</p>'}${btn('Browse free agents','go','fa')}</div>`}
let filter='ALL';function freeAgents(){let list=fa().filter(p=>filter==='ALL'||p.pos===filter);return `<div class="panel"><h2>Available Free Agents (${fa().length})</h2><p class="muted">Demonstration pool: fictional players. Not a verified league-wide list.</p><label>Position <select id="posfilter"><option>ALL</option>${Object.keys(requirements).map(pos=>`<option ${filter===pos?'selected':''}>${pos}</option>`).join('')}</select></label>${list.length?list.map(p=>playerRow(p,btn('Negotiate','negotiate',p.id,mine().length>=53)+btn('Practice squad','pssign',p.id,money()<p.salary||ps().length>=16))).join(''):'<p>No players available at this position in the demo pool.</p>'}</div>`}
function activity(){return `<div class="panel"><h2>Transaction History</h2>${s.log.map(l=>`<div class="line"><div><strong>Week ${l.week}</strong><span class="muted">${escape(l.text)}</span></div></div>`).join('')}</div>`}
function rand(n){return Math.floor(Math.random()*n)}
function opponent(){return season.opponents[season.week-1]||'OFFSEASON'}
function currentPlan(){return season.plans[season.week]||(season.plans[season.week]={})}
function missing(){return shortages().reduce((n,[pos,target])=>n+Math.max(0,target-counts()[pos]),0)}
function healthy(){return mine().filter(p=>!season.injuries.some(i=>i.id===p.id&&i.until>=season.week))}
function choice(label,kind,value,detail){let chosen=currentPlan()[kind]===value;return `<button class="choice ${chosen?'chosen':''}" data-action="plan" data-kind="${kind}" data-id="${value}"><b>${chosen?'✓ ':''}${label}</b><span class="muted">${detail}</span></button>`}
function weekView(){const w=season.week,op=opponent(),p=currentPlan(),isBye=op==='BYE',complete=season.reports.some(r=>r.week===w),inj=season.injuries.filter(i=>i.until>=w),needs=shortages(),rec=season.reports.at(-1);
return `<div class="toolbar"><div class="panel" style="margin:0"><div class="line"><div><strong>2026 · WEEK ${w} / 18</strong><span class="muted">${isBye?'Bye week':'CIN vs '+op} · ${season.wins}-${season.losses} · Owner ${season.confidence}/100</span></div><div class="actions">${btn('Roster','go','roster')}${btn('Free agents','go','fa')}</div></div></div></div>
<div class="weekcard"><h2>${isBye?'BYE WEEK · FRONT OFFICE REVIEW':'WEEK '+w+' · CINCINNATI vs '+op}</h2><p class="muted">Choose a game plan and a personnel priority, then simulate. Results appear here immediately and remain in the calendar.</p><div><span class="pill">Active ${mine().length}/53</span><span class="pill">Healthy ${healthy().length}</span><span class="pill">Position gaps ${needs.length}</span><span class="pill">Cap $${money().toFixed(1)}M</span></div>
${inj.length?`<div class="alert"><strong>Injury report</strong>${inj.map(i=>`<p>${escape(s.players.find(x=>x.id===i.id)?.name||'Player')} · out through Week ${i.until}</p>`).join('')}</div>`:''}
${needs.length?`<div class="alert"><strong>Personnel alert · ${needs.length} position groups under target</strong><p>${needs.slice(0,4).map(([pos,n])=>`${pos} ${counts()[pos]}/${n}`).join(' · ')}</p>${btn('Resolve roster needs','go','roster')} ${btn('Find free agents','go','fa')}</div>`:''}
<h3>${isBye?'Organizational focus':'1 · Coaching meeting — offensive approach'}</h3><div class="choices">${choice('Balanced attack','off','balanced','Lower variance; steady offensive production.')}${choice('Air it out','off','pass','More explosive plays, greater turnover and sack exposure.')}${choice('Ground and pound','off','run','Control the clock; less explosive passing.')}</div>
<h3>2 · Defensive game plan</h3><div class="choices">${choice('Base defense','def','base','Flexible, lower-risk alignment.')}${choice('Pressure packages','def','blitz','More sacks and turnovers, vulnerable to big plays.')}${choice('Two-high coverage','def','coverage','Limit explosive plays, give up more underneath.')}</div>
<h3>3 · GM personnel directive</h3><div class="choices">${choice('Protect starters','personnel','protect','Lower injury risk; fewer development reps.')}${choice('Develop young players','personnel','develop','Extra development opportunity, increased volatility.')}${choice('Win now','personnel','win','Veterans receive priority; short-term competitive boost.')}</div>
<div class="line"><div><strong>${Object.keys(p).length}/3 decisions set</strong><span class="muted">You can revisit any choice before simulating.</span></div><div class="actions"><button class="primary" data-action="simulate" ${['off','def','personnel'].every(k=>p[k])?'':'disabled'}>${isBye?'Complete Bye Week':'Simulate Week '+w}</button></div></div></div>
${rec?`<div class="panel"><h3>Most recent result · Week ${rec.week}</h3><p>${escape(rec.headline)}</p>${btn('Read full report','report',String(rec.week))}</div>`:''}`}
function calendarView(){return `<div class="panel"><h2>Season Calendar · ${season.wins}-${season.losses}</h2><p class="muted">Completed weeks have permanent reports. The current week is accessible directly from its card.</p>${season.opponents.map((op,i)=>{const w=i+1,r=season.reports.find(r=>r.week===w);return `<div class="line"><div><strong>Week ${w} · ${op==='BYE'?'BYE':`vs ${op}`}</strong><span class="muted">${r?escape(r.headline):w===season.week?'Current · Decisions awaiting you':'Upcoming'}</span></div><div class="actions">${r?btn('Game report','report',String(w)):w===season.week?btn('Open decisions','go','week'):''}</div></div>`}).join('')}</div>`}
function reportView(w){let r=season.reports.find(x=>x.week===Number(w));if(!r)return '<div class="panel">Report unavailable.</div>';return `<div class="panel"><h2>Week ${r.week} · Postgame GM Report</h2><div class="report"><h2>${escape(r.headline)}</h2><p>${escape(r.summary)}</p></div><h3>What your decisions changed</h3><p>${escape(r.explanation)}</p><h3>Personnel & injuries</h3><p>${escape(r.injury)}</p><h3>Owner reaction</h3><p>${escape(r.owner)}</p><h3>Roster at kickoff</h3><p>Active ${r.active}/53 · Healthy ${r.healthy} · Position groups under target ${r.gaps}</p>${btn('Back to calendar','go','calendar')} ${btn('Current week','go','week')}</div>`}
function simulate(){generateTradeOffers();if(season.week>18)return notice('Season complete.');let p=currentPlan();if(!['off','def','personnel'].every(k=>p[k]))return notice('Complete all three decisions first.');if(season.reports.some(r=>r.week===season.week))return notice('This week is already complete.');let w=season.week,op=opponent(),isBye=op==='BYE',gaps=missing(),good=healthy(),injured='No new injuries reported.',off=rand(13),def=rand(13),person=rand(9);let base=17+rand(14)+Math.round((good.reduce((n,x)=>n+x.ovr,0)/(good.length||1)-72)*.23)-Math.min(12,gaps);let ours=Math.max(3,base+off+(p.off==='pass'?rand(12)-4:p.off==='run'?rand(7)-3:0)+(p.personnel==='win'?4:0));let theirs=Math.max(3,15+rand(20)+def+(p.def==='blitz'?rand(11)-5:p.def==='coverage'?-2:0));if(p.off==='pass'&&rand(5)===0)ours=Math.max(0,ours-7);if(p.def==='blitz'&&rand(5)===0)theirs+=7;
let win=isBye?null:ours>theirs;if(!isBye&&ours===theirs){ours++;win=true}if(!isBye){if(win)season.wins++;else season.losses++;season.confidence=Math.max(0,Math.min(100,season.confidence+(win?3:-4)));}
if(!isBye&&good.length&&rand(100)<(p.personnel==='protect'?10:p.personnel==='develop'?28:20)){let victim=good[rand(good.length)],duration=1+rand(3);season.injuries.push({id:victim.id,until:w+duration});injured=`${victim.name} (${victim.pos}) suffered a simulated injury; unavailable through Week ${w+duration}.`;}
if(p.personnel==='develop'){let young=good.filter(x=>x.ovr<80);if(young.length){let a=young[rand(young.length)];a.ovr=Math.min(99,a.ovr+1);injured+=` ${a.name} improved to ${a.ovr} OVR through development reps.`}}
let headline=isBye?'Bye week completed':`CIN ${ours} — ${op} ${theirs} · ${win?'WIN':'LOSS'}`;
let explanation=`Offense: ${p.off}. Defense: ${p.def}. Personnel: ${p.personnel}. ${gaps?'Roster depth shortages imposed a performance penalty.':'No depth-shortage penalty.'} The result includes randomness; plans shift probabilities, not guarantee victories.`;
let report={week:w,op,headline,summary:isBye?'The staff used the bye week for personnel review and preparation.':`The Bengals ${win?'won':'lost'} against ${op}. Season record: ${season.wins}-${season.losses}.`,explanation,injury:injured,owner:`Owner confidence: ${season.confidence}/100. ${win?'The result increased confidence.':'The result lowered confidence.'}`,active:mine().length,healthy:good.length,gaps:shortages().length};season.reports.push(report);addSocial(headline);s.log.unshift({week:w,text:headline});season.week++;s.week=season.week;save();tab='report:'+w;render();window.scrollTo(0,0)}

function addSocial(event){
 const neg=/lost|released|injur|loss|rejected|declined/i.test(event), trade=/trad|block|offer/i.test(event), win=/WIN|won|victory/i.test(event);
 const snippets=trade?[
  ['@WhoDeyTillIDie',`Wait... ${event} Someone explain the plan here. 👀`],
  ['@QueenCityFilmRoom',`Trade value matters more than the headline. ${event} Let's see how this impacts the depth chart.`],
  ['@JungleMemes',`Me checking the trade desk every five minutes after: ${event} 😂`],
  ['@CincySportsRadio',`Phone lines are open. Grade this front-office move: ${event}`]
 ]:neg?[
  ['@WhoDeyTillIDie',`Not the news I wanted today. ${event} 😭`],
  ['@QueenCityFilmRoom',`There's a football explanation for this, but the next move matters. ${event}`],
  ['@CincySportsRadio',`The fanbase is heated after this update: ${event}`],
  ['@JungleMemes',`This season is testing my blood pressure. ${event} 💀`]
 ]:win?[
  ['@WhoDeyTillIDie',`THAT'S WHAT I'M TALKING ABOUT! ${event} WHO DEY! 🐅`],
  ['@QueenCityFilmRoom',`Big result. The tape will tell us whether the personnel plan paid off. ${event}`],
  ['@JungleMemes',`WE'RE GOING TO THE SUPER BOWL (I say this every win) 😂 ${event}`]
 ]:[
  ['@BengalsInsider',`Front office update: ${event}`],
  ['@QueenCityFilmRoom',`The cap and roster implications are worth watching: ${event}`],
  ['@WhoDeyTillIDie',`I'm cautiously optimistic. ${event}`],
  ['@CincySportsRadio',`Would YOU have made this move? ${event}`]
 ];
 const start=s.socialCounter||0;s.socialCounter=start+1;
 const n=Math.min(3,snippets.length);
 for(let i=n-1;i>=0;i--){const [who,comment]=snippets[(start+i)%snippets.length];s.social.unshift({week:season.week,who,text:comment,likes:12+Math.floor(Math.random()*1800),replies:3+Math.floor(Math.random()*190)})}
 s.social=s.social.slice(0,150);
}
function socialView(){return `<div class="panel"><h2>Social Pulse 2.0 · Cincinnati</h2><p class="muted">Fictional fans, film analysts, radio callers and insiders react differently to actual in-game decisions. All accounts and posts are fictional.</p>${s.social.length?s.social.map(x=>`<div class="socialpost"><strong>${escape(x.who)}</strong><span class="tiny"> · Week ${x.week}</span><p>${escape(x.text)}</p><span class="tiny">♡ ${x.likes||'—'} · 💬 ${x.replies||'—'}</span></div>`).join(''):'<p>No stories yet. Sign a player, list someone on the trade block or simulate a game.</p>'}</div>`}
function assistantView(){
 let needs=shortages(),targets=needs.map(([pos,n])=>({pos,short:n-counts()[pos],options:fa().filter(p=>p.pos===pos).sort((a,b)=>b.ovr-a.ovr)}));
 return `<div class="panel"><h2>Assistant GM</h2><p class="muted">Choose how much help you want. Automated moves are limited to demonstration free agents and simplified salary rules.</p><div class="actions" style="justify-content:flex-start">${['manual','guided','auto'].map(m=>`<button class="${s.assistantMode===m?'primary':''}" data-action="assistantMode" data-id="${m}">${m.toUpperCase()}</button>`).join('')}</div><div class="assistant"><strong>Personnel recommendations</strong><p>${needs.length} position groups under planning targets. ${targets.filter(t=>t.options.length).length} have available free agents in this small demo pool.</p>${targets.slice(0,8).map(t=>`<div class="line"><div><strong>${t.pos}: need ${t.short}</strong><span class="tiny">${t.options[0]?`Best available: ${escape(t.options[0].name)} · OVR ${t.options[0].ovr}`:'No available player in demo pool'}</span></div><div class="actions">${t.options[0]?btn('Review offer','negotiate',t.options[0].id):''}</div></div>`).join('')}</div>${s.assistantMode==='auto'?`<button class="primary" data-action="autoRepair" data-id="">Auto-fill affordable needs</button><p class="tiny">Signs up to 3 affordable demo free agents on one-year contracts. Requires a confirmation. No star releases, trades or existing contracts are changed.</p>`:s.assistantMode==='guided'?'<p class="muted">Guided mode makes recommendations; you approve every signing.</p>':'<p class="muted">Manual mode: all personnel actions are yours.</p>'}</div>`;
}
function autoRepair(){
 if(!confirm('Assistant GM will sign up to three affordable demo free agents for uncovered positions. Continue?'))return;
 let made=[];
 for(let [pos] of shortages()){
   if(made.length>=3||mine().length>=53)break;
   let p=fa().filter(x=>x.pos===pos&&x.salary<=money()).sort((a,b)=>b.ovr-a.ovr)[0];
   if(!p)continue;
   p.team=TEAM;p.status='active';p.years=1;p.contract={years:1,base:p.salary,bonus:0,guaranteed:0,total:p.salary,year1:p.salary,annual:[p.salary]};
   made.push(p.name);
 }
 if(!made.length)return notice('No affordable eligible demo players available.');
 log(`Assistant GM signed ${made.join(', ')} to address roster shortages.`);
}
let negotiating=null;
function openNegotiation(p){
 if(!p||p.status!=='FA')return notice('Player is no longer available.');
 negotiating=p.id;
 $('overlay').innerHTML=`<div class="modalshade"><div class="modal"><h2>Negotiate · ${escape(p.name)}</h2><p class="muted">${p.pos} · OVR ${p.ovr} · Demo player · Market asking salary $${p.salary}M/year</p><label>Contract years <input id="nyears" type="number" min="1" max="5" value="2"></label><label>Annual base salary ($M) <input id="nbase" type="number" min=".5" max="80" step=".5" value="${p.salary}"></label><label>Signing bonus ($M) <input id="nbonus" type="number" min="0" max="100" step=".5" value="2"></label><label>Additional guaranteed salary ($M) <input id="nguarantee" type="number" min="0" max="100" step=".5" value="0"></label><div id="npreview" class="assistant"></div><div id="offerResult" aria-live="polite"></div><div class="actions"><button data-action="negotiationClose" data-id="">Cancel</button><button class="primary" data-action="offer" data-id="${p.id}">Submit offer</button></div><p class="tiny">Simplified cap model: flat annual base, signing bonus prorated over up to five years; additional guarantees shown as risk, not automatically added to cap twice. No escalators, offsets or NFL minimum-salary rules.</p></div></div>`;

function offerValues(){
 const years=Number($('nyears').value),base=Number($('nbase').value),bonus=Number($('nbonus').value),guarantee=Number($('nguarantee').value);
 if(!Number.isInteger(years)||years<1||years>5||![base,bonus,guarantee].every(Number.isFinite)||base<.5||base>80||bonus<0||bonus>100||guarantee<0||guarantee>100)return null;
 const total=years*base+bonus,year1=base+bonus/years;
 if(guarantee>years*base)return null;
 return {years,base,bonus,guarantee,total,year1,annual:Array(years).fill(year1)};
}
function previewOffer(){
 let v=offerValues();if(!v){$('npreview').textContent='Enter a valid offer. Additional guaranteed salary cannot exceed total base salaries.';return}
 let after=money()-v.year1;
 $('npreview').innerHTML=`<strong>Contract preview</strong><p>Total: $${v.total.toFixed(1)}M · ${v.years} years<br>Year 1 cap charge: $${v.year1.toFixed(1)}M<br>Current cap space: $${money().toFixed(1)}M → <b class="${after<0?'warn':'ok'}">$${after.toFixed(1)}M</b><br>Future cap charges: ${v.annual.slice(1).map((n,i)=>`Year ${i+2}: $${n.toFixed(1)}M`).join(' · ')||'None'}<br>Potential signing-bonus dead cap if cut after year 1: $${(v.bonus*(v.years-1)/v.years).toFixed(1)}M, plus any applicable guaranteed salary.<br>Active roster: ${mine().length} → ${mine().length+1}/53</p><span class="tiny">Future cap space requires future league cap, existing contracts, and rollover data; not yet available in this demo.</span>`;
}
let pendingOffer=null;
function agentResponse(p,v){
 const appeal=v.base+v.bonus/v.years+v.guarantee/(v.years*3);
 if(appeal<p.salary*.9)return {status:'rejected',message:`Your proposal is significantly below my client's $${p.salary.toFixed(1)}M annual asking price. We can't recommend this deal.`,counter:null};
 if(appeal<p.salary*1.08){
   const base=Math.max(.5,Math.ceil(p.salary*1.04*2)/2);
   return {status:'counter',message:`We're interested, but need stronger compensation to commit. Here is our counteroffer.`,counter:{years:v.years,base,bonus:v.bonus,guarantee:v.guarantee}};
 }
 return {status:'accepted',message:`My client is comfortable with the proposed terms. We have a deal in principle, subject to your final approval.`,counter:null};
}
function showOfferResult(title,message,buttons){
 const el=$('offerResult');
 el.innerHTML=`<div class="assistant" style="border:2px solid #fb4f14;margin-top:14px"><h3>${escape(title)}</h3><p>${escape(message)}</p><div class="actions">${buttons}</div></div>`;
 el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function submitOffer(id){
 const p=s.players.find(x=>x.id===id),v=offerValues();
 if(!p||p.status!=='FA'||!v)return showOfferResult('Offer not submitted','Check the contract fields and player availability.',btn('Edit offer','offerEdit',id));
 if(mine().length>=53||v.year1>money())return showOfferResult('Offer blocked','Insufficient current cap room or no available active roster spot.',btn('Edit offer','offerEdit',id)+btn('Walk away','negotiationClose',''));
 pendingOffer={id,terms:v};
 const response=agentResponse(p,v);
 const terms=`${v.years} years, $${v.total.toFixed(1)}M total, $${v.year1.toFixed(1)}M first-year cap charge.`;
 if(response.status==='rejected'){
   pendingOffer=null;
   showOfferResult('OFFER REJECTED',response.message,btn('Revise and resubmit','offerEdit',id)+btn('Walk away','negotiationClose',''));
 }else if(response.status==='counter'){
   pendingOffer.counter=response.counter;
   const c=response.counter;
   showOfferResult('AGENT COUNTEROFFER',`${response.message} ${c.years} years, $${(c.years*c.base+c.bonus).toFixed(1)}M total ($${c.base.toFixed(1)}M annual base, $${c.bonus.toFixed(1)}M bonus).`,btn('Accept counter','offerAcceptCounter',id)+btn('Revise offer','offerEdit',id)+btn('Walk away','negotiationClose',''));
 }else{
   showOfferResult('OFFER ACCEPTED',`${response.message} ${terms}`,btn('Finalize signing','offerFinalize',id)+btn('Revise offer','offerEdit',id)+btn('Walk away','negotiationClose',''));
 }
}
function editOffer(){
 pendingOffer=null;
 $('offerResult').innerHTML='';
 $('nyears').focus();
}
function acceptCounter(id){
 if(!pendingOffer||pendingOffer.id!==id||!pendingOffer.counter)return;
 const c=pendingOffer.counter;
 $('nyears').value=c.years;$('nbase').value=c.base;$('nbonus').value=c.bonus;$('nguarantee').value=c.guarantee;
 previewOffer();
 pendingOffer={id,terms:offerValues()};
 const v=pendingOffer.terms;
 showOfferResult('COUNTEROFFER AGREED',`You and the agent have agreed in principle to ${v.years} years and $${v.total.toFixed(1)}M. Finalize to add the player.`,btn('Finalize signing','offerFinalize',id)+btn('Revise offer','offerEdit',id)+btn('Walk away','negotiationClose',''));
}
function finalizeOffer(id){
 const p=s.players.find(x=>x.id===id),offer=pendingOffer,v=offer?.terms;
 if(!p||p.status!=='FA'||!offer||offer.id!==id||!v)return;
 if(mine().length>=53||v.year1>money())return showOfferResult('Cannot finalize','The roster or cap situation changed. Revise the offer.',btn('Revise offer','offerEdit',id));
 p.team=TEAM;p.status='active';p.salary=v.year1;p.years=v.years;p.contract=v;
 pendingOffer=null;$('overlay').innerHTML='';
 log(`Signed ${p.name}: ${v.years} years, $${v.total.toFixed(1)}M total, $${v.bonus.toFixed(1)}M signing bonus. Year 1 cap hit $${v.year1.toFixed(1)}M.`);
}


// Alpha 7.4: demonstration contract management and simulated inbound trade market.
let contractMode='extend',contractPlayer=null;
function closeOverlay(){$('overlay').innerHTML=''}
function deadMoney(p){return Math.max(0,Number(p.contract?.bonus||0)/Math.max(1,Number(p.contract?.years||p.years||1))*Math.max(0,(p.years||1)-1))}
function openPlayer(p){if(!p||p.team!==TEAM)return;const dead=deadMoney(p);$('overlay').innerHTML=`<div class="modalshade"><div class="modal"><h2>${escape(p.name)} · ${p.pos}</h2><p class="muted">OVR ${p.ovr} · ${p.years} years remaining · ${p.real?'Real name / simulated contract':'Fictional demonstration player'}</p><div class="assistant"><b>Contract overview (demo)</b><p>Annual cap hit: $${p.salary.toFixed(1)}M · Estimated release dead money: $${dead.toFixed(1)}M · Estimated savings: $${(p.salary-dead).toFixed(1)}M</p><p class="tiny">These are simplified simulated figures, not verified NFL contracts.</p></div><div class="actions">${btn('Extend','extend',p.id)}${btn('Restructure','restructure',p.id)}${btn(s.tradeBlock[p.id]?'Remove from block':'Add to trade block','block',p.id)}${btn('Release','release',p.id)}</div><div class="actions" style="margin-top:18px">${btn('Close','negotiationClose','')}</div></div></div>`}
function openContract(p,mode){if(!p||p.team!==TEAM)return;contractMode=mode;contractPlayer=p.id;let years=mode==='extend'?Math.min(5,p.years+2):p.years;let base=mode==='extend'?p.salary+1:Math.max(.5,p.salary*.65);let bonus=mode==='extend'?2:Math.max(0,(p.salary-base)*years);$('overlay').innerHTML=`<div class="modalshade"><div class="modal"><h2>${mode==='extend'?'Extend':'Restructure'} · ${escape(p.name)}</h2><p class="muted">Current annual cap charge $${p.salary.toFixed(1)}M · ${p.years} years remaining. ${mode==='restructure'?'Convert salary into prorated bonus (illustrative only).':'Negotiate a new deal (illustrative terms).'}</p><label>Years <input id="cYears" type="number" min="1" max="5" value="${years}" ${mode==='restructure'?'readonly':''}></label><label>Annual base salary ($M) <input id="cBase" type="number" min="0.5" max="90" step="0.5" value="${base.toFixed(1)}"></label><label>Signing / converted bonus ($M) <input id="cBonus" type="number" min="0" max="100" step="0.5" value="${bonus.toFixed(1)}"></label><div id="cPreview" class="assistant"></div><div class="actions">${btn('Cancel','negotiationClose','')}${btn('Submit contract','contractSave',p.id)}</div><p class="tiny">Simplified model. No actual NFL cap accounting, existing bonus proration, void years, minimum salaries, guarantees or agent negotiations yet.</p></div></div>`;previewContract()}
function previewContract(){let p=s.players.find(x=>x.id===contractPlayer),y=Number($('cYears')?.value),b=Number($('cBase')?.value),bonus=Number($('cBonus')?.value);if(!p||!$('cPreview'))return;let ok=Number.isInteger(y)&&y>=1&&y<=5&&b>=.5&&bonus>=0;let hit=ok?b+bonus/y:0;let difference=p.salary-hit;$('cPreview').innerHTML=ok?`<b>Before → After</b><p>Current: $${p.salary.toFixed(1)}M/year → New: $${hit.toFixed(1)}M/year</p><p>Year-one cap ${difference>=0?'freed':'used'}: $${Math.abs(difference).toFixed(1)}M</p><p>Projected total new commitment: $${(b*y+bonus).toFixed(1)}M across ${y} years</p>`:'Enter valid contract terms.'}
function saveContract(id){let p=s.players.find(x=>x.id===id),y=Number($('cYears')?.value),b=Number($('cBase')?.value),bonus=Number($('cBonus')?.value);if(!p||p.team!==TEAM||!Number.isInteger(y)||y<1||y>5||!Number.isFinite(b)||b<.5||!Number.isFinite(bonus)||bonus<0)return notice('Check contract fields.');let hit=b+bonus/y;if(hit-p.salary>money())return notice('Not enough illustrative cap space.');if(!confirm(`${contractMode==='extend'?'Extend':'Restructure'} ${p.name}? New cap charge $${hit.toFixed(1)}M/year, $${(b*y+bonus).toFixed(1)}M total. This is a simulated contract, not NFL-accurate accounting.`))return;p.salary=hit;p.years=y;p.contract={years:y,base:b,bonus,annual:Array(y).fill(hit)};closeOverlay();log(`${contractMode==='extend'?'Extended':'Restructured'} ${p.name}: ${y} years, $${(b*y+bonus).toFixed(1)}M total, $${hit.toFixed(1)}M annual illustrative cap charge.`)}
function generateTradeOffers(force=false){if(!force&&season.week===s.tradeTick)return;const listed=mine().filter(p=>s.tradeBlock[p.id]);if(!listed.length){if(force)notice('List a player first to attract calls.');return}if(!force&&Math.random()>.75){s.tradeTick=season.week;return}const p=listed[Math.floor(Math.random()*listed.length)],buyers=teams.filter(t=>t!==TEAM),buyer=buyers[Math.floor(Math.random()*buyers.length)];let round=p.ovr>=90?1:p.ovr>=80?2:p.ovr>=72?3:5;s.tradeInbox.unshift({id:'t'+Date.now(),playerId:p.id,buyer,round,year:season.year+1,status:'open',week:season.week});s.tradeInbox=s.tradeInbox.slice(0,25);s.tradeTick=season.week;save();if(force)log(`${buyer} called about ${p.name}. New offer in Trade Desk.`)}
function tradeDesk(){let listed=mine().filter(p=>s.tradeBlock[p.id]);return `<div class="panel"><h2>Trade Block · ${listed.length} listed</h2><p class="muted">Add players from Active Roster or their player profile. Other GMs may call after weekly simulation. All offers here are fictional demo proposals.</p>${listed.length?listed.map(p=>playerRow(p,btn('Manage','manage',p.id)+btn('Unlist','block',p.id))).join(''):'<p>No players listed yet.</p>'}${btn('View roster','go','roster')} ${btn('Test incoming call','tradeRefresh','')}</div><div class="panel"><h2>GM Inbox · ${s.tradeInbox.filter(t=>t.status==='open').length} open</h2>${s.tradeInbox.length?s.tradeInbox.map(t=>{let p=s.players.find(x=>x.id===t.playerId);return `<div class="line"><div><strong>${escape(t.buyer)} GM · ${escape(p?.name||'Former player')}</strong><span class="muted">Offers ${t.year} Round ${t.round} pick · Week ${t.week} · ${t.status.toUpperCase()}</span></div><div class="actions">${t.status==='open'?`<button data-action="tradeReply" data-id="${t.id}" data-reply="accept">Accept</button><button data-action="tradeReply" data-id="${t.id}" data-reply="counter">Counter</button><button data-action="tradeReply" data-id="${t.id}" data-reply="reject">Reject</button>`:''}</div></div>`}).join(''):'<p>No calls yet. Put a player on the trade block and advance a week.</p>'}<p class="tiny">Prototype: picks are tracked as a transaction ledger, not yet assigned from verified team-owned draft capital. CPU team rosters and actual league trade validation are not implemented.</p></div>`}
function replyTrade(id,reply){let t=s.tradeInbox.find(x=>x.id===id),p=s.players.find(x=>x.id===t?.playerId);if(!t||t.status!=='open')return;if(reply==='counter'){let round=Number(prompt('Counteroffer: request which draft round? (1–7)',Math.max(1,t.round-1)));if(!Number.isInteger(round)||round<1||round>7)return;t.round=round;if(Math.random()<.45){t.status='rejected';log(`${t.buyer} rejected your counteroffer for ${p?.name||'the player'}.`)}else{log(`${t.buyer} accepted your counter terms: a ${t.year} round ${round} pick for ${p?.name||'the player'}. Review and accept in GM Inbox.`)}return}if(reply==='reject'){t.status='rejected';log(`Declined ${t.buyer}'s offer for ${p?.name||'a player'}.`);return}if(!p||p.team!==TEAM){t.status='expired';save();render();return}if(!confirm(`Trade ${p.name} to ${t.buyer} for a ${t.year} round ${t.round} pick? This DEMO tracks the pick in a ledger; it does not yet model full league ownership or NFL trade cap rules.`))return;p.team=t.buyer;p.status='active';delete s.tradeBlock[p.id];t.status='accepted';s.acquiredPicks=s.acquiredPicks||[];s.acquiredPicks.push({from:t.buyer,year:t.year,round:t.round});log(`Traded ${p.name} to ${t.buyer} for ${t.year} round ${t.round} draft pick (demo ledger).`)}
document.addEventListener('input',e=>{if(['cYears','cBase','cBonus'].includes(e.target.id))previewContract()});


// Roster import. Data comes from an actual user-selected or network-downloaded 2026 nflverse CSV.
// This does NOT imply verified salary, rating, or free-agent status.
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field);rows.push(row)}if(!rows.length)return [];const heads=rows.shift().map(h=>h.trim().toLowerCase().replace(/^\ufeff/,''));return rows.map(r=>Object.fromEntries(heads.map((h,i)=>[h,r[i]||''])))}
function normalizePos(raw){const p=String(raw||'').toUpperCase();return ({HB:'RB',FB:'RB',T:'OT',LT:'OT',RT:'OT',G:'OG',LG:'OG',RG:'OG',DE:'EDGE',OLB:'LB',ILB:'LB',NT:'DT',FS:'S',SS:'S',PK:'K'}[p]||p||'UNK')}
function importedStatus(raw){let v=String(raw||'').toUpperCase();if(/PRACTICE|^PS$|^PRA$/.test(v))return 'practice';if(/RES|IR|PUP|NFI|SUSP/.test(v))return 'reserve';return 'active'}
function setupView(){return `<div class="panel"><h2>2026 NFL Roster Database</h2><p>Import a dated nflverse 2026 roster CSV to populate all 32 teams. The game will not label demo players as current real-world personnel.</p><div class="alert"><b>Current save: ${s.rosterSource?'Imported roster':'Demonstration roster'}</b><p>${s.rosterSource?escape(s.rosterSource)+' · '+s.players.length+' players':'Demo players only. Import required for real rosters.'}</p></div><p class="muted">The online download requires an internet connection and the source to permit browser downloads. If it fails, use the CSV file picker below.</p><div class="actions" style="justify-content:flex-start"><button class="primary" data-action="importOnline" data-id="">Fetch 2026 NFL rosters</button><button data-action="go" data-id="roster">View current roster</button></div><label style="display:block;margin:18px 0">Or choose a 2026 roster CSV file:<input id="rosterCsv" type="file" accept=".csv,text/csv" style="display:block;margin-top:10px;width:100%"></label><p id="importStatus" class="muted"></p><p class="tiny">Source: nflverse / nflverse-data, roster_2026.csv. Verify snapshot date independently. The source's season roster may not represent today's transaction-by-transaction status. Imported player names, teams and roster status are data-backed; OVR and contract numbers remain clearly simulated. Import creates a fresh career and does not modify older Alpha 7.3 saves.</p><p><a href="https://github.com/nflverse/nflverse-data/releases/tag/rosters" target="_blank" rel="noopener" style="color:#ffad82">Open nflverse roster releases</a></p></div>`}
async function importOnline(){const el=$('importStatus');el.textContent='Downloading 2026 roster file…';try{const response=await fetch('https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_2026.csv',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);await importRosterText(await response.text(),'nflverse 2026 season roster CSV (downloaded '+new Date().toISOString().slice(0,10)+')')}catch(e){el.textContent='Online import failed: '+e.message+'. Download the CSV from the roster releases link and choose the file manually.'}}
async function importRosterText(text,source){const el=$('importStatus');try{const rows=parseCSV(text);if(!rows.length||!rows[0].full_name||!rows[0].team)throw Error('Expected nflverse CSV columns full_name and team.');const byId=new Map();for(const r of rows){if(r.season&&r.season!=='2026')continue;const team=(r.team||'').trim().toUpperCase();if(!teams.includes(team))continue;const name=(r.full_name||'').trim();if(!name)continue;const id=r.gsis_id||r.player_id||r.espn_id||team+':'+name;const pos=normalizePos(r.position);const status=importedStatus(r.status);byId.set(id,{id:'nfl_'+id,name,pos,team,status,ovr:68,salary:1.5,years:1,real:true,simulated:true,jersey:r.jersey_number||'',rawStatus:r.status||''})}const players=[...byId.values()];const counts=new Set(players.map(p=>p.team));if(players.length<1000||counts.size!==32)throw Error('Incomplete league data ('+players.length+' players, '+counts.size+' teams). No changes made.');if(!confirm('Import '+players.length+' players across 32 teams? This resets ONLY this Alpha 7.4 career. All ratings and contracts will be simulated placeholders.'))return;s=seed();s.players=players;s.rosterSource=source;s.rosterCount=players.length;s.tradeInbox=[];s.tradeBlock={};s.social=[];s.log=[{week:1,text:'Imported '+players.length+' real player names and team assignments from '+source+'. Contracts and ratings remain simulated.'}];s.season=null;const newSeason={year:2026,week:1,wins:0,losses:0,bye:7,opponents:['BAL','PIT','CLE','KC','BUF','NE','BYE','NYJ','HOU','DEN','BAL','IND','PIT','MIA','CLE','LAC','JAX','TEN'],plans:{},reports:[],injuries:[],confidence:65};s.season=newSeason;Object.assign(season,newSeason);save();tab='roster';render();notice('Imported '+players.length+' NFL players. Contracts/OVR are simulated.')}catch(e){if(el)el.textContent='Import failed: '+e.message}}
function render(){let sections=[['setup','Roster Database'],['week','This Week'],['calendar','Calendar'],['trades','Trade Desk'],['brief','Personnel Briefing'],['roster','Active Roster'],['practice','Practice Squad'],['fa','Free Agents'],['history','Transactions'],['social','Social Pulse'],['assistant','Assistant GM']];$('stats').innerHTML=`<div class="stat"><span class="muted">ACTIVE ROSTER</span><b>${mine().length}/53</b></div><div class="stat"><span class="muted">PRACTICE SQUAD</span><b>${ps().length}/16</b></div><div class="stat"><span class="muted">ILLUSTRATIVE CAP SPACE</span><b class="${money()<0?'warn':'ok'}">$${money().toFixed(1)}M</b></div>`;$('tabs').innerHTML=sections.map(([id,label])=>`<button data-action="go" data-id="${id}" class="${id===tab?'primary':''}">${label}</button>`).join('');$('content').innerHTML=({setup:setupView,trades:tradeDesk,brief,roster,practice,fa:freeAgents,history:activity,social:socialView,assistant:assistantView,week:weekView,calendar:calendarView})[tab]?.()|| (tab.startsWith('report:')?reportView(tab.split(':')[1]):'');}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const {action,id}=b.dataset;if(action==='importOnline'){importOnline()}else if(action==='go'){tab=id;render();window.scrollTo(0,0)}else if(action==='find'){filter=id;tab='fa';render();window.scrollTo(0,0)}else if(action==='plan'){currentPlan()[b.dataset.kind]=id;save();render()}else if(action==='simulate'){simulate()}else if(action==='negotiationClose'){pendingOffer=null;$('overlay').innerHTML=''}else if(action==='offer'){submitOffer(id)}else if(action==='offerEdit'){editOffer()}else if(action==='offerAcceptCounter'){acceptCounter(id)}else if(action==='offerFinalize'){finalizeOffer(id)}else if(action==='manage'){openPlayer(s.players.find(p=>p.id===id))}else if(action==='contractSave'){saveContract(id)}else if(action==='tradeReply'){replyTrade(id,b.dataset.reply)}else if(action==='tradeRefresh'){generateTradeOffers(true)}else if(action==='assistantMode'){s.assistantMode=id;save();render()}else if(action==='autoRepair'){autoRepair()}else if(action==='report'){tab='report:'+id;render();window.scrollTo(0,0)}else act(action,id)});document.addEventListener('change',e=>{if(e.target.id==='rosterCsv'&&e.target.files?.[0]){e.target.files[0].text().then(t=>importRosterText(t,'User-selected nflverse 2026 CSV'))}if(e.target.id==='posfilter'){filter=e.target.value;render()}});save();render();
})();
</script></body></html>
