<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Front Office · Alpha 7.1</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f5f5;background:#111315}*{box-sizing:border-box}body{margin:0}header{padding:18px;background:linear-gradient(130deg,#17191c,#332017);border-bottom:3px solid #fb4f14}header small{letter-spacing:2px;color:#ffb38f}h1{margin:6px 0;font-size:26px}main{max-width:980px;margin:auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.panel{background:#202327;border:1px solid #393d42;border-radius:13px;padding:13px}.stat b{display:block;font-size:21px}.muted{color:#b5b9bf;font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0}.tabs button{white-space:nowrap}button,select{background:#30353b;color:white;border:1px solid #555c64;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button.primary{background:#fb4f14;border-color:#fb4f14;color:#141414;font-weight:800}button:disabled{opacity:.4;cursor:not-allowed}.panel{margin:12px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #363a40}.line:last-child{border-bottom:0}.line>div:first-child{min-width:0}.line strong{display:block}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions button{font-size:12px;padding:7px}.alert{border-left:4px solid #fb4f14;padding:10px;background:#31251f;margin:8px 0}.ok{color:#80d4a2}.warn{color:#ffba78}h2{font-size:19px}h3{font-size:15px}#notice{position:sticky;top:0;background:#382b1c;padding:10px;border-radius:8px;display:none;z-index:5}footer{padding:20px;color:#aaa;font-size:12px;text-align:center}.tag{font-size:11px;padding:3px 7px;border-radius:20px;background:#40454b}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.line{align-items:flex-start}.line .actions{max-width:150px}h1{font-size:22px}} .weekcard{border:1px solid #fb4f14;border-radius:14px;padding:14px;background:linear-gradient(125deg,#33241c,#202327);margin:12px 0}.choices{display:grid;grid-template-columns:1fr;gap:8px}.choice{text-align:left;width:100%;padding:12px}.choice.chosen{border-color:#fb4f14;background:#4c2d20}.choice b{display:block}.report{border-left:4px solid #76c79a;padding:12px;background:#1c3029;margin:10px 0}.toolbar{position:sticky;top:0;background:#111315ed;z-index:4;padding:8px 0}.pill{display:inline-block;background:#40352e;border-radius:30px;padding:5px 9px;font-size:12px;margin:3px} </style></head><body>
<header><small>THE FRONT OFFICE / CINCINNATI</small><h1>GENERAL MANAGER COMMAND CENTER</h1><div class="muted">ALPHA 7.1 · WEEKLY GM LAB · DEMONSTRATION DATA</div></header><main><div id="notice"></div><div id="stats" class="stats"></div><nav class="tabs" id="tabs"></nav><section id="content"></section></main><footer>Alpha 7.1 is a fictional gameplay prototype using demonstration personnel, simplified cap and simulated opponents. It shares Alpha 7.0 lab save data; Alpha 6 is separate.</footer>
<script>
(()=>{'use strict';
const KEY='frontoffice_alpha70_lab_v1',CAP=255,TEAM='CIN';
const requirements={QB:2,RB:3,WR:5,TE:3,OT:3,OG:3,C:2,EDGE:4,DT:3,LB:4,CB:5,S:4,K:1,P:1,LS:1};
const teams=['ARI','ATL','BAL','BUF','CAR','CHI','CIN','CLE','DAL','DEN','DET','GB','HOU','IND','JAX','KC','LV','LAC','LAR','MIA','MIN','NE','NO','NYG','NYJ','PHI','PIT','SF','SEA','TB','TEN','WAS'];
const sample=[
['Joe Burrow','QB',45,4,94],['Ja’Marr Chase','WR',39,4,97],['Tee Sample','WR',5,1,73],['Myles Sample','OT',6,2,75],['Owen Sample','TE',3,2,74],['Rico Sample','RB',4,2,76],['Devon Sample','EDGE',10,3,83],['Caleb Sample','CB',7,2,77],['Marcus Sample','S',5,2,75],['Evan Sample','K',2,2,82],
['Andre Mercer','OT',3,1,69],['Darius Cole','OT',2,1,66],['Trey Maddox','OG',2,1,68],['Jalen Price','CB',2,1,70],['Noah Banks','WR',1,1,67],['Eli Rivers','LB',2,1,68],['Malik Ward','DT',3,1,71],['Sam Porter','QB',2,1,65],['Tyson Reid','EDGE',3,1,72],['Dante Brooks','S',1,1,67],['Liam Foster','C',2,1,69],['Evan Hayes','RB',1,1,68]
];
function seed(){let players=sample.map((a,i)=>({id:'p'+i,name:a[0],pos:a[1],salary:a[2],years:a[3],ovr:a[4],team:i<10?TEAM:null,status:i<10?'active':'FA',real:i<2}));return {version:1,week:1,year:2026,team:TEAM,players,log:[{week:1,text:'New demonstration career created. Personnel actions are now available.'}],decisions:[],history:[]}}
let s;try{s=JSON.parse(localStorage.getItem(KEY))||seed()}catch{s=seed()}if(!s.players||!Array.isArray(s.players))s=seed();let tab='week';
if(!s.season){s.season={year:2026,week:1,wins:0,losses:0,bye:7,opponents:['BAL','PIT','CLE','KC','BUF','NE','BYE','NYJ','HOU','DEN','BAL','IND','PIT','MIA','CLE','LAC','JAX','TEN'],plans:{},reports:[],injuries:[],confidence:65};}
const season=s.season; if(!season.plans)season.plans={};if(!season.reports)season.reports=[];if(!season.injuries)season.injuries=[];

const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(s)),mine=()=>s.players.filter(p=>p.team===TEAM&&p.status==='active'),ps=()=>s.players.filter(p=>p.team===TEAM&&p.status==='practice'),fa=()=>s.players.filter(p=>p.status==='FA'),spent=()=>mine().concat(ps()).reduce((n,p)=>n+p.salary,0),money=()=>CAP-spent(),counts=()=>Object.fromEntries(Object.keys(requirements).map(pos=>[pos,mine().filter(p=>p.pos===pos).length])),shortages=()=>Object.entries(requirements).filter(([pos,n])=>counts()[pos]<n),escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(t){let el=$('notice');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3500)}
function log(t){s.log.unshift({week:s.week,text:t});s.log=s.log.slice(0,150);save();render();notice(t)}
function playerRow(p,buttons){return `<div class="line"><div><strong>${escape(p.name)} <span class="tag">${p.pos}</span></strong><span class="muted">OVR ${p.ovr} · $${p.salary}M · ${p.years} yr${p.years===1?'':'s'} ${p.real?'· REAL NAME / DEMO CONTRACT':'· FICTIONAL'}</span></div><div class="actions">${buttons}</div></div>`}
function btn(label,action,id,disabled=false){return `<button data-action="${action}" data-id="${id}" ${disabled?'disabled':''}>${label}</button>`}
function act(action,id){const p=s.players.find(x=>x.id===id);if(!p)return;const active=mine().length,practice=ps().length;
if(action==='sign'){if(p.status!=='FA'||money()<p.salary||active>=53)return notice('Cannot sign: check cap and active roster limit.');p.team=TEAM;p.status='active';log(`Signed ${p.name} (${p.pos}) to the active roster for $${p.salary}M.`)}
if(action==='pssign'){if(p.status!=='FA'||money()<p.salary||practice>=16)return notice('Cannot sign to practice squad: check cap and squad limit.');p.team=TEAM;p.status='practice';log(`Signed ${p.name} to the practice squad. (Eligibility simplified in this lab.)`)}
if(action==='promote'){if(p.team!==TEAM||p.status!=='practice'||active>=53)return notice('Cannot promote: active roster is full.');p.status='active';log(`Promoted ${p.name} from practice squad to active roster.`)}
if(action==='demote'){if(p.team!==TEAM||p.status!=='active'||practice>=16)return notice('Cannot move player to practice squad.');if(!confirm(`Move ${p.name} to practice squad? Real NFL waiver/eligibility rules are NOT simulated yet.`))return;p.status='practice';log(`Moved ${p.name} to practice squad (simplified lab rules).`)}
if(action==='release'){if(p.team!==TEAM)return;if(!confirm(`Release ${p.name}? In this lab the salary is freed immediately; real guarantees/dead cap are not yet modeled.`))return;p.team=null;p.status='FA';log(`Released ${p.name} to free agency (no dead cap modeled).`)}
}
function brief(){let needs=shortages(),last=s.log[0];return `<div class="panel"><h2>Week ${s.week} · Personnel Briefing</h2><p class="muted">Your roster needs affect weekly simulation. Use This Week to plan and simulate games.</p><div class="alert"><strong>${needs.length} position groups below target</strong><p>Roster targets are planning guidelines, not NFL roster minimums. Every shortage links to a useful action.</p></div>${needs.slice(0,7).map(([pos,n])=>`<div class="line"><div><strong>${pos}: ${counts()[pos]} / target ${n}</strong><span class="muted">${n-counts()[pos]} additional recommended</span></div><div class="actions">${btn('Find players','find',pos)}</div></div>`).join('')}<h3>Latest transaction</h3><p>${escape(last?.text||'None')}</p></div><div class="panel"><h2>Weekly Personnel Review</h2><p>Review your roster, sign available players, and promote practice-squad depth. Personnel decisions now affect weekly games. Open This Week to plan and simulate.</p>${btn('Review free agents','go','fa')} ${btn('View full roster','go','roster')}</div>`}
function roster(){let c=counts();return `<div class="panel"><h2>Active Roster (${mine().length}/53)</h2><p class="muted">Demo roster, not the actual 2026 Bengals. Position targets are illustrative.</p>${Object.entries(requirements).map(([pos,n])=>`<div class="line"><div><strong>${pos} · ${c[pos]} / ${n} ${c[pos]<n?'⚠️':''}</strong><span class="muted">${c[pos]<n?`Need ${n-c[pos]} for planning target`:'Target met'}</span></div><div class="actions">${btn('Find '+pos,'find',pos)}</div></div>${mine().filter(p=>p.pos===pos).map(p=>playerRow(p,btn('Practice squad','demote',p.id,ps().length>=16)+btn('Release','release',p.id))).join('')}`).join('')}</div>`}
function practice(){return `<div class="panel"><h2>Practice Squad (${ps().length}/16)</h2><p class="muted">Promotion and demotion work. Waiver rules, veteran eligibility and game-day elevation limits will be implemented later.</p>${ps().length?ps().map(p=>playerRow(p,btn('Promote','promote',p.id,mine().length>=53)+btn('Release','release',p.id))).join(''):'<p>No practice squad players yet. Sign some from the available player pool.</p>'}${btn('Browse free agents','go','fa')}</div>`}
let filter='ALL';function freeAgents(){let list=fa().filter(p=>filter==='ALL'||p.pos===filter);return `<div class="panel"><h2>Available Free Agents (${fa().length})</h2><p class="muted">Demonstration pool: fictional players. Not a verified league-wide list.</p><label>Position <select id="posfilter"><option>ALL</option>${Object.keys(requirements).map(pos=>`<option ${filter===pos?'selected':''}>${pos}</option>`).join('')}</select></label>${list.length?list.map(p=>playerRow(p,btn('Sign active','sign',p.id,money()<p.salary||mine().length>=53)+btn('Sign practice','pssign',p.id,money()<p.salary||ps().length>=16))).join(''):'<p>No players available at this position in the demo pool.</p>'}</div>`}
function activity(){return `<div class="panel"><h2>Transaction History</h2>${s.log.map(l=>`<div class="line"><div><strong>Week ${l.week}</strong><span class="muted">${escape(l.text)}</span></div></div>`).join('')}</div>`}
function rand(n){return Math.floor(Math.random()*n)}
function opponent(){return season.opponents[season.week-1]||'OFFSEASON'}
function currentPlan(){return season.plans[season.week]||(season.plans[season.week]={})}
function missing(){return shortages().reduce((n,[pos,target])=>n+Math.max(0,target-counts()[pos]),0)}
function healthy(){return mine().filter(p=>!season.injuries.some(i=>i.id===p.id&&i.until>=season.week))}
function choice(label,kind,value,detail){let chosen=currentPlan()[kind]===value;return `<button class="choice ${chosen?'chosen':''}" data-action="plan" data-kind="${kind}" data-id="${value}"><b>${chosen?'✓ ':''}${label}</b><span class="muted">${detail}</span></button>`}
function weekView(){const w=season.week,op=opponent(),p=currentPlan(),isBye=op==='BYE',complete=season.reports.some(r=>r.week===w),inj=season.injuries.filter(i=>i.until>=w),needs=shortages(),rec=season.reports.at(-1);
return `<div class="toolbar"><div class="panel" style="margin:0"><div class="line"><div><strong>2026 · WEEK ${w} / 18</strong><span class="muted">${isBye?'Bye week':'CIN vs '+op} · ${season.wins}-${season.losses} · Owner ${season.confidence}/100</span></div><div class="actions">${btn('Roster','go','roster')}${btn('Free agents','go','fa')}</div></div></div></div>
<div class="weekcard"><h2>${isBye?'BYE WEEK · FRONT OFFICE REVIEW':'WEEK '+w+' · CINCINNATI vs '+op}</h2><p class="muted">Choose a game plan and a personnel priority, then simulate. Results appear here immediately and remain in the calendar.</p><div><span class="pill">Active ${mine().length}/53</span><span class="pill">Healthy ${healthy().length}</span><span class="pill">Position gaps ${needs.length}</span><span class="pill">Cap $${money().toFixed(1)}M</span></div>
${inj.length?`<div class="alert"><strong>Injury report</strong>${inj.map(i=>`<p>${escape(s.players.find(x=>x.id===i.id)?.name||'Player')} · out through Week ${i.until}</p>`).join('')}</div>`:''}
${needs.length?`<div class="alert"><strong>Personnel alert · ${needs.length} position groups under target</strong><p>${needs.slice(0,4).map(([pos,n])=>`${pos} ${counts()[pos]}/${n}`).join(' · ')}</p>${btn('Resolve roster needs','go','roster')} ${btn('Find free agents','go','fa')}</div>`:''}
<h3>${isBye?'Organizational focus':'1 · Coaching meeting — offensive approach'}</h3><div class="choices">${choice('Balanced attack','off','balanced','Lower variance; steady offensive production.')}${choice('Air it out','off','pass','More explosive plays, greater turnover and sack exposure.')}${choice('Ground and pound','off','run','Control the clock; less explosive passing.')}</div>
<h3>2 · Defensive game plan</h3><div class="choices">${choice('Base defense','def','base','Flexible, lower-risk alignment.')}${choice('Pressure packages','def','blitz','More sacks and turnovers, vulnerable to big plays.')}${choice('Two-high coverage','def','coverage','Limit explosive plays, give up more underneath.')}</div>
<h3>3 · GM personnel directive</h3><div class="choices">${choice('Protect starters','personnel','protect','Lower injury risk; fewer development reps.')}${choice('Develop young players','personnel','develop','Extra development opportunity, increased volatility.')}${choice('Win now','personnel','win','Veterans receive priority; short-term competitive boost.')}</div>
<div class="line"><div><strong>${Object.keys(p).length}/3 decisions set</strong><span class="muted">You can revisit any choice before simulating.</span></div><div class="actions"><button class="primary" data-action="simulate" ${['off','def','personnel'].every(k=>p[k])?'':'disabled'}>${isBye?'Complete Bye Week':'Simulate Week '+w}</button></div></div></div>
${rec?`<div class="panel"><h3>Most recent result · Week ${rec.week}</h3><p>${escape(rec.headline)}</p>${btn('Read full report','report',String(rec.week))}</div>`:''}`}
function calendarView(){return `<div class="panel"><h2>Season Calendar · ${season.wins}-${season.losses}</h2><p class="muted">Completed weeks have permanent reports. The current week is accessible directly from its card.</p>${season.opponents.map((op,i)=>{const w=i+1,r=season.reports.find(r=>r.week===w);return `<div class="line"><div><strong>Week ${w} · ${op==='BYE'?'BYE':`vs ${op}`}</strong><span class="muted">${r?escape(r.headline):w===season.week?'Current · Decisions awaiting you':'Upcoming'}</span></div><div class="actions">${r?btn('Game report','report',String(w)):w===season.week?btn('Open decisions','go','week'):''}</div></div>`}).join('')}</div>`}
function reportView(w){let r=season.reports.find(x=>x.week===Number(w));if(!r)return '<div class="panel">Report unavailable.</div>';return `<div class="panel"><h2>Week ${r.week} · Postgame GM Report</h2><div class="report"><h2>${escape(r.headline)}</h2><p>${escape(r.summary)}</p></div><h3>What your decisions changed</h3><p>${escape(r.explanation)}</p><h3>Personnel & injuries</h3><p>${escape(r.injury)}</p><h3>Owner reaction</h3><p>${escape(r.owner)}</p><h3>Roster at kickoff</h3><p>Active ${r.active}/53 · Healthy ${r.healthy} · Position groups under target ${r.gaps}</p>${btn('Back to calendar','go','calendar')} ${btn('Current week','go','week')}</div>`}
function simulate(){if(season.week>18)return notice('Season complete.');let p=currentPlan();if(!['off','def','personnel'].every(k=>p[k]))return notice('Complete all three decisions first.');if(season.reports.some(r=>r.week===season.week))return notice('This week is already complete.');let w=season.week,op=opponent(),isBye=op==='BYE',gaps=missing(),good=healthy(),injured='No new injuries reported.',off=rand(13),def=rand(13),person=rand(9);let base=17+rand(14)+Math.round((good.reduce((n,x)=>n+x.ovr,0)/(good.length||1)-72)*.23)-Math.min(12,gaps);let ours=Math.max(3,base+off+(p.off==='pass'?rand(12)-4:p.off==='run'?rand(7)-3:0)+(p.personnel==='win'?4:0));let theirs=Math.max(3,15+rand(20)+def+(p.def==='blitz'?rand(11)-5:p.def==='coverage'?-2:0));if(p.off==='pass'&&rand(5)===0)ours=Math.max(0,ours-7);if(p.def==='blitz'&&rand(5)===0)theirs+=7;
let win=isBye?null:ours>theirs;if(!isBye&&ours===theirs){ours++;win=true}if(!isBye){if(win)season.wins++;else season.losses++;season.confidence=Math.max(0,Math.min(100,season.confidence+(win?3:-4)));}
if(!isBye&&good.length&&rand(100)<(p.personnel==='protect'?10:p.personnel==='develop'?28:20)){let victim=good[rand(good.length)],duration=1+rand(3);season.injuries.push({id:victim.id,until:w+duration});injured=`${victim.name} (${victim.pos}) suffered a simulated injury; unavailable through Week ${w+duration}.`;}
if(p.personnel==='develop'){let young=good.filter(x=>x.ovr<80);if(young.length){let a=young[rand(young.length)];a.ovr=Math.min(99,a.ovr+1);injured+=` ${a.name} improved to ${a.ovr} OVR through development reps.`}}
let headline=isBye?'Bye week completed':`CIN ${ours} — ${op} ${theirs} · ${win?'WIN':'LOSS'}`;
let explanation=`Offense: ${p.off}. Defense: ${p.def}. Personnel: ${p.personnel}. ${gaps?'Roster depth shortages imposed a performance penalty.':'No depth-shortage penalty.'} The result includes randomness; plans shift probabilities, not guarantee victories.`;
let report={week:w,op,headline,summary:isBye?'The staff used the bye week for personnel review and preparation.':`The Bengals ${win?'won':'lost'} against ${op}. Season record: ${season.wins}-${season.losses}.`,explanation,injury:injured,owner:`Owner confidence: ${season.confidence}/100. ${win?'The result increased confidence.':'The result lowered confidence.'}`,active:mine().length,healthy:good.length,gaps:shortages().length};season.reports.push(report);s.log.unshift({week:w,text:headline});season.week++;s.week=season.week;save();tab='report:'+w;render();window.scrollTo(0,0)}
function render(){let sections=[['week','This Week'],['calendar','Calendar'],['brief','Personnel Briefing'],['roster','Active Roster'],['practice','Practice Squad'],['fa','Free Agents'],['history','Transactions']];$('stats').innerHTML=`<div class="stat"><span class="muted">ACTIVE ROSTER</span><b>${mine().length}/53</b></div><div class="stat"><span class="muted">PRACTICE SQUAD</span><b>${ps().length}/16</b></div><div class="stat"><span class="muted">ILLUSTRATIVE CAP SPACE</span><b class="${money()<0?'warn':'ok'}">$${money().toFixed(1)}M</b></div>`;$('tabs').innerHTML=sections.map(([id,label])=>`<button data-action="go" data-id="${id}" class="${id===tab?'primary':''}">${label}</button>`).join('');$('content').innerHTML=({brief,roster,practice,fa:freeAgents,history:activity,week:weekView,calendar:calendarView})[tab]?.()|| (tab.startsWith('report:')?reportView(tab.split(':')[1]):'');}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const {action,id}=b.dataset;if(action==='go'){tab=id;render();window.scrollTo(0,0)}else if(action==='find'){filter=id;tab='fa';render();window.scrollTo(0,0)}else if(action==='plan'){currentPlan()[b.dataset.kind]=id;save();render()}else if(action==='simulate'){simulate()}else if(action==='report'){tab='report:'+id;render();window.scrollTo(0,0)}else act(action,id)});document.addEventListener('change',e=>{if(e.target.id==='posfilter'){filter=e.target.value;render()}});save();render();
})();
</script></body></html>
